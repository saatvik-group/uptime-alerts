# Every 5 minutes: read the watchtower status list and open or close "DOWN: <app>" issues (see check.mjs). GitHub may run it a few minutes late.
# Once a month: add a dated line to KEEPALIVE.md, because GitHub turns off scheduled runs after 60 days without commits.
name: uptime
on:
  schedule:
    - cron: '2-59/5 * * * *'
    - cron: '23 4 1 * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Add a made-up app "test-app" that is down, to try the alert'
        type: boolean
        default: false
permissions:
  issues: write
  contents: write
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    if: github.event.schedule != '23 4 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node check.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEST: ${{ inputs.test }}
  keepalive:
    if: github.event.schedule == '23 4 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # keeps its token: this job pushes the monthly line
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          echo "- $(date -u +%Y-%m-%d)" >> KEEPALIVE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KEEPALIVE.md
          git commit -m "Keepalive $(date -u +%Y-%m-%d)"
          git push
